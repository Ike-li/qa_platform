name: Feature request
description: 提议一个新能力
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述实际遇到的场景，而不是直接给方案。有具体例子最好。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 可选。如果已有想法就写，没有也可以只提问题。
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他做法
      description: 可选。包括「用现有功能绕过去」这类。
