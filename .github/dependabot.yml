# 依赖更新。安全告警由 GitHub 默认扫描提供，这里配置的是常规版本更新。
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # 补丁与次要版本合成一个 PR，避免每周十几个 PR 淹没通知
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # vitest 与 @vitest/* 互为精确 peer 依赖，分开升级哪个都装不上
      # （npm ERESOLVE）。放在 npm-minor-patch 之前——依赖归入第一个匹配的组。
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint（截至 8.70.1，含 canary）要求 typescript <6.1.0，
      # TS 7 装不上。typescript-eslint 放开 peer 范围后删除这条。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 运行时是 Node 22（engines、CI、Dockerfile），@types/node 的 major 应跟随
      # 运行时而非最新版，否则只有新版 Node 才有的 API 也能通过类型检查。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
