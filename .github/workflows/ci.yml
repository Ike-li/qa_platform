name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaplatform
          POSTGRES_PASSWORD: qaplatform
          POSTGRES_DB: qaplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qaplatform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
      QAP_REDIS_URL: redis://localhost:6379/0
      QAP_S3_ENDPOINT: http://localhost:9000
      QAP_S3_ACCESS_KEY: minioadmin
      QAP_S3_SECRET_KEY: minioadmin
      QAP_JWT_SECRET: test-secret
      QAP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run backend tests
        run: pytest --cov=qaplatform

  backend-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Pull docker images (with retry)
        run: |
          for image in alpine:3.19 python:3.12-alpine; do
            for attempt in 1 2 3; do
              docker pull "$image" && break
              echo "Pull attempt $attempt failed for $image, retrying..."
              sleep 10
            done
          done

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest tests/integration/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install root test dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
          QAP_REDIS_URL: redis://localhost:6379/0
          QAP_S3_ENDPOINT: http://localhost:9000
          QAP_S3_ACCESS_KEY: minioadmin
          QAP_S3_SECRET_KEY: minioadmin
          QAP_S3_BUCKET: qa-platform
          QAP_JWT_SECRET: ci-test-jwt-secret-not-for-production-use
          QAP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: npm run test:e2e
