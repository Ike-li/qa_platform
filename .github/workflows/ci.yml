name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly heavy integration lane: 03:00 Asia/Shanghai.
    - cron: "0 19 * * *"

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check (debt-aware)
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/frontend-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors=$(grep "error TS" /tmp/frontend-tsc.log || true)
          if [ -z "$errors" ]; then
            exit "$status"
          fi
          unexpected=$(printf "%s\n" "$errors" | grep -Ev "src/components/projects/analytics-panel.tsx|src/components/projects/notification-rules-panel.tsx|src/components/runs/trigger-run-modal.tsx" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors outside known T-FRONTEND-TS debt:"
            printf "%s\n" "$unexpected"
            exit "$status"
          fi
          echo "Only known T-FRONTEND-TS debt files produced TypeScript errors."

      - name: Lint
        run: npm run lint --if-present

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaplatform
          POSTGRES_PASSWORD: qaplatform
          POSTGRES_DB: qaplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qaplatform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
      QAP_REDIS_URL: redis://localhost:6379/0
      QAP_S3_ENDPOINT: http://localhost:9000
      QAP_S3_ACCESS_KEY: minioadmin
      QAP_S3_SECRET_KEY: minioadmin
      QAP_JWT_SECRET: test-secret-at-least-32bytes-long!
      QAP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run backend tests
        run: pytest --cov=qaplatform --cov-report=term-missing --tb=short --durations=20

  backend-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run required integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest tests/integration/ -m "not heavy_docker and not external_stack" -v --tb=short --durations=20

      - name: Pull heavy docker images (nightly/manual, with retry)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          for image in alpine:3.19 python:3.12-alpine; do
            pulled=0
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                pulled=1
                break
              fi
              echo "Pull attempt $attempt failed for $image, retrying..."
              sleep 10
            done
            if [ "$pulled" -ne 1 ]; then
              echo "Failed to pull $image after 3 attempts"
              exit 1
            fi
          done

      - name: Run heavy docker integration tests (nightly/manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest tests/integration/ -m "heavy_docker and not external_stack" -v --tb=short --durations=20

      - name: Run external-stack worker integration tests (nightly/manual, if stack is reachable)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest tests/integration/ -m "external_stack" -v --tb=short --durations=20

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (debt-aware)
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/frontend-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors=$(grep "error TS" /tmp/frontend-build.log || true)
          if [ -z "$errors" ]; then
            exit "$status"
          fi
          unexpected=$(printf "%s\n" "$errors" | grep -Ev "src/components/projects/analytics-panel.tsx|src/components/projects/notification-rules-panel.tsx|src/components/runs/trigger-run-modal.tsx" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors outside known T-FRONTEND-TS debt:"
            printf "%s\n" "$unexpected"
            exit "$status"
          fi
          echo "Only known T-FRONTEND-TS debt files produced TypeScript errors."

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install root test dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env for docker-compose (api/worker services reference it)
        run: |
          cat > .env <<'EOF'
          QAP_DATABASE_URL=postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
          QAP_REDIS_URL=redis://localhost:6379/0
          QAP_S3_ENDPOINT=http://localhost:9000
          QAP_S3_ACCESS_KEY=minioadmin
          QAP_S3_SECRET_KEY=minioadmin
          QAP_JWT_SECRET=ci-test-jwt-secret-not-for-production-use
          QAP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF

      - name: Run E2E tests
        env:
          E2E_ADMIN_PASSWORD: admin123
          QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
          QAP_REDIS_URL: redis://localhost:6379/0
          QAP_S3_ENDPOINT: http://localhost:9000
          QAP_S3_ACCESS_KEY: minioadmin
          QAP_S3_SECRET_KEY: minioadmin
          QAP_S3_BUCKET: qa-platform
          QAP_JWT_SECRET: ci-test-jwt-secret-not-for-production-use
          QAP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run test:e2e
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            npm run test:e2e -- tests/e2e/real-login-flow.spec.ts tests/e2e/real-run-trigger.spec.ts tests/e2e/special-regressions.spec.ts
          else
            npm run test:e2e -- tests/e2e/auth-flow.spec.ts
          fi
