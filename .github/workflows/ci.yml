name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly heavy integration lane: 03:00 Asia/Shanghai.
    - cron: "0 19 * * *"

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check (debt-aware)
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/frontend-tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors=$(grep "error TS" /tmp/frontend-tsc.log || true)
          if [ -z "$errors" ]; then
            exit "$status"
          fi
          unexpected=$(printf "%s\n" "$errors" | grep -Ev "src/components/projects/analytics-panel.tsx|src/components/projects/notification-rules-panel.tsx|src/components/runs/trigger-run-modal.tsx" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors outside known T-FRONTEND-TS debt:"
            printf "%s\n" "$unexpected"
            exit "$status"
          fi
          echo "Only known T-FRONTEND-TS debt files produced TypeScript errors."

      - name: Lint
        run: npm run lint --if-present

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaplatform
          POSTGRES_PASSWORD: qaplatform
          POSTGRES_DB: qaplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qaplatform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
      QAP_REDIS_URL: redis://localhost:6379/0
      QAP_S3_ENDPOINT: http://localhost:9000
      QAP_S3_ACCESS_KEY: minioadmin
      QAP_S3_SECRET_KEY: minioadmin
      QAP_JWT_SECRET: test-secret-at-least-32bytes-long!
      QAP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize backend test artifacts
        shell: bash
        run: |
          mkdir -p artifacts/backend-test
          {
            echo "job=backend-test"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
          } > artifacts/backend-test/manifest.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run backend tenant isolation audit
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/check_tenant_isolation.py --self-test \
            2>&1 | tee artifacts/backend-test/tenant-isolation-audit.log
          status=$?
          set -e
          exit "$status"

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run backend lint
        run: ruff check src tests

      - name: Run backend tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest \
            --cov=qaplatform \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/backend-test/backend-coverage.xml \
            --cov-report=json:artifacts/backend-test/backend-coverage.json \
            --junitxml=artifacts/backend-test/backend-unit.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-test/backend-unit.log
          status=$?
          set -e
          exit "$status"

      - name: Validate backend test artifacts
        if: always()
        shell: bash
        run: |
          manifest=artifacts/backend-test/evidence-manifest.txt
          {
            echo "# backend-test evidence manifest"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            find artifacts/backend-test -maxdepth 1 -type f -print | sort
          } > "$manifest"
          missing=0
          for path in \
            artifacts/backend-test/backend-unit.log \
            artifacts/backend-test/backend-unit.xml \
            artifacts/backend-test/backend-coverage.xml \
            artifacts/backend-test/backend-coverage.json \
            artifacts/backend-test/tenant-isolation-audit.log
          do
            if [ ! -s "$path" ]; then
              echo "missing_or_empty=$path" | tee -a "$manifest"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-artifacts
          path: artifacts/backend-test/
          if-no-files-found: error

  backend-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize backend integration artifacts
        shell: bash
        run: |
          mkdir -p artifacts/backend-integration
          {
            echo "job=backend-integration-test"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
          } > artifacts/backend-integration/manifest.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run required integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/ \
            -m "not heavy_docker and not external_stack and not performance" \
            -v \
            --junitxml=artifacts/backend-integration/required-integration.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/required-integration.log
          status=$?
          set -e
          exit "$status"

      - name: Pull heavy docker images (nightly/manual, with retry)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          for image in alpine:3.19 python:3.12-alpine; do
            pulled=0
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                pulled=1
                break
              fi
              echo "Pull attempt $attempt failed for $image, retrying..."
              sleep 10
            done
            if [ "$pulled" -ne 1 ]; then
              echo "Failed to pull $image after 3 attempts"
              exit 1
            fi
          done

      - name: Run heavy docker integration tests (nightly/manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          RUN_INTEGRATION_TESTS: "1"
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/ \
            -m "heavy_docker and not external_stack" \
            -v \
            --junitxml=artifacts/backend-integration/heavy-docker-integration.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/heavy-docker-integration.log
          status=$?
          set -e
          exit "$status"

      - name: Prepare external API/worker stack env (nightly/manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: cp .env.example .env

      - name: Start external API/worker stack (nightly/manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          docker compose up -d --build postgres redis minio minio-init api worker worker-high worker-low
          for attempt in {1..36}; do
            if curl -fsS http://localhost:8000/ready; then
              exit 0
            fi
            docker compose ps
            sleep 5
          done
          docker compose ps > artifacts/backend-integration/external-stack-startup-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps --tail=200 \
            postgres redis minio minio-init api worker worker-high worker-low \
            2>&1 | tee artifacts/backend-integration/external-stack-startup.log
          exit 1

      - name: Run external-stack worker integration tests (nightly/manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          RUN_INTEGRATION_TESTS: "1"
          QAP_EXTERNAL_STACK_REQUIRED: "1"
          QAP_EXTERNAL_STACK_GIT_URL: https://github.com/octocat/Hello-World.git
          QAP_EXTERNAL_STACK_GIT_REF: master
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/ \
            -m "external_stack and not performance" \
            -v \
            --junitxml=artifacts/backend-integration/external-stack-integration.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/external-stack-integration.log
          status=$?
          set -e
          exit "$status"

      - name: Run external-stack worker performance smoke (nightly/manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          RUN_INTEGRATION_TESTS: "1"
          RUN_PERFORMANCE_TESTS: "1"
          QAP_EXTERNAL_STACK_REQUIRED: "1"
          QAP_EXTERNAL_STACK_GIT_URL: https://github.com/octocat/Hello-World.git
          QAP_EXTERNAL_STACK_GIT_REF: master
          QAP_PERFORMANCE_SUMMARY_JSONL: artifacts/backend-integration/performance-smoke-summary.jsonl
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/test_worker_execute.py \
            -m "external_stack and performance" \
            -v \
            --junitxml=artifacts/backend-integration/external-stack-performance.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/external-stack-performance.log
          status=$?
          set -e
          exit "$status"

      - name: Collect external stack logs (nightly/manual)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          docker compose ps > artifacts/backend-integration/external-stack-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps --tail=500 \
            postgres redis minio minio-init api worker worker-high worker-low \
            > artifacts/backend-integration/external-stack-docker.log 2>&1 || true

      - name: Stop external API/worker stack (nightly/manual)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: docker compose down -v || true

      - name: Run backend performance smoke (nightly/manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          RUN_INTEGRATION_TESTS: "1"
          RUN_PERFORMANCE_TESTS: "1"
          QAP_PERFORMANCE_SUMMARY_JSONL: artifacts/backend-integration/performance-smoke-summary.jsonl
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/test_performance_smoke.py \
            -m "performance" \
            -v \
            --junitxml=artifacts/backend-integration/performance-smoke.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/performance-smoke.log
          status=$?
          set -e
          exit "$status"

      - name: Write performance smoke summary artifact (nightly/manual)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        shell: bash
        run: |
          {
            echo "# Performance Smoke Summary"
            echo
            echo "- event: ${GITHUB_EVENT_NAME}"
            echo "- sha: ${GITHUB_SHA}"
            echo
            if [ -f artifacts/backend-integration/performance-smoke-summary.jsonl ]; then
              echo '```json'
              cat artifacts/backend-integration/performance-smoke-summary.jsonl
              echo '```'
            else
              echo "No performance summary JSONL was generated before the test process ended."
            fi
          } > artifacts/backend-integration/performance-smoke-summary.md

      - name: Validate backend integration artifacts
        if: always()
        shell: bash
        run: |
          manifest=artifacts/backend-integration/evidence-manifest.txt
          {
            echo "# backend-integration evidence manifest"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            find artifacts/backend-integration -maxdepth 1 -type f -print | sort
          } > "$manifest"

          expected=(
            artifacts/backend-integration/required-integration.log
            artifacts/backend-integration/required-integration.xml
          )
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            expected+=(
              artifacts/backend-integration/heavy-docker-integration.log
              artifacts/backend-integration/heavy-docker-integration.xml
              artifacts/backend-integration/external-stack-docker.log
              artifacts/backend-integration/external-stack-ps.txt
              artifacts/backend-integration/external-stack-integration.log
              artifacts/backend-integration/external-stack-integration.xml
              artifacts/backend-integration/external-stack-performance.log
              artifacts/backend-integration/external-stack-performance.xml
              artifacts/backend-integration/performance-smoke.log
              artifacts/backend-integration/performance-smoke.xml
              artifacts/backend-integration/performance-smoke-summary.jsonl
              artifacts/backend-integration/performance-smoke-summary.md
            )
          fi

          missing=0
          for path in "${expected[@]}"; do
            if [ ! -s "$path" ]; then
              echo "missing_or_empty=$path" | tee -a "$manifest"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload backend integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-artifacts
          path: artifacts/backend-integration/
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (debt-aware)
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/frontend-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors=$(grep "error TS" /tmp/frontend-build.log || true)
          if [ -z "$errors" ]; then
            exit "$status"
          fi
          unexpected=$(printf "%s\n" "$errors" | grep -Ev "src/components/projects/analytics-panel.tsx|src/components/projects/notification-rules-panel.tsx|src/components/runs/trigger-run-modal.tsx" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors outside known T-FRONTEND-TS debt:"
            printf "%s\n" "$unexpected"
            exit "$status"
          fi
          echo "Only known T-FRONTEND-TS debt files produced TypeScript errors."

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install root test dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env for docker-compose (api/worker services reference it)
        run: |
          cat > .env <<'EOF'
          QAP_DATABASE_URL=postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
          QAP_REDIS_URL=redis://localhost:6379/0
          QAP_S3_ENDPOINT=http://localhost:9000
          QAP_S3_ACCESS_KEY=minioadmin
          QAP_S3_SECRET_KEY=minioadmin
          QAP_JWT_SECRET=ci-test-jwt-secret-not-for-production-use
          QAP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF

      - name: Run E2E tests
        env:
          E2E_ADMIN_PASSWORD: admin123
          QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
          QAP_REDIS_URL: redis://localhost:6379/0
          QAP_S3_ENDPOINT: http://localhost:9000
          QAP_S3_ACCESS_KEY: minioadmin
          QAP_S3_SECRET_KEY: minioadmin
          QAP_S3_BUCKET: qa-platform
          QAP_JWT_SECRET: ci-test-jwt-secret-not-for-production-use
          QAP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run test:e2e
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            npm run test:e2e -- tests/e2e/real-login-flow.spec.ts tests/e2e/real-run-trigger.spec.ts tests/e2e/special-regressions.spec.ts
          else
            npm run test:e2e -- tests/e2e/auth-flow.spec.ts
          fi
