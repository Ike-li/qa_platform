name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gate:
        description: CI gate profile to run
        required: true
        default: release_candidate
        type: choice
        options:
          - pr_like
          - nightly
          - release_candidate
  schedule:
    # Nightly heavy integration lane: 03:00 Asia/Shanghai.
    - cron: "0 19 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  doc-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check document health
        run: |
          chmod +x scripts/check-docs.sh
          ./scripts/check-docs.sh

  lint-and-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

  frontend-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run --coverage

      - name: Upload frontend unit JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-junit
          path: frontend/test-results/vitest-junit.xml
          if-no-files-found: error

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaplatform
          POSTGRES_PASSWORD: qaplatform
          POSTGRES_DB: qaplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qaplatform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
      QAP_REDIS_URL: redis://localhost:6379/0
      QAP_S3_ENDPOINT: http://localhost:9000
      QAP_S3_ACCESS_KEY: minioadmin
      QAP_S3_SECRET_KEY: minioadmin
      QAP_JWT_SECRET: test-secret-at-least-32bytes-long!
      QAP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize backend test artifacts
        shell: bash
        run: |
          mkdir -p artifacts/backend-test
          {
            echo "job=backend-test"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
          } > artifacts/backend-test/manifest.txt

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run backend tenant isolation audit
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/check_tenant_isolation.py --self-test \
            2>&1 | tee artifacts/backend-test/tenant-isolation-audit.log
          status=$?
          set -e
          exit "$status"

      - name: Install backend dependencies (from uv.lock)
        run: |
          python -m pip install uv
          uv lock --check
          uv export --frozen --extra dev --no-emit-project --no-hashes -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps -e .

      - name: Run backend lint
        run: ruff check src tests

      - name: Check workflow YAML for duplicate keys
        run: python scripts/check_workflow_yaml.py

      - name: Run backend tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest \
            tests/unit \
            --cov=qaplatform \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/backend-test/backend-coverage.xml \
            --cov-report=json:artifacts/backend-test/backend-coverage.json \
            --junitxml=artifacts/backend-test/backend-unit.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-test/backend-unit.log
          status=$?
          set -e
          exit "$status"

      - name: Validate backend test artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          manifest=artifacts/backend-test/evidence-manifest.txt
          {
            echo "# backend-test evidence manifest"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pytest_scope=tests/unit"
            echo
            find artifacts/backend-test -maxdepth 1 -type f -print | sort
          } > "$manifest"
          missing=0
          for path in \
            artifacts/backend-test/backend-unit.log \
            artifacts/backend-test/backend-unit.xml \
            artifacts/backend-test/backend-coverage.xml \
            artifacts/backend-test/backend-coverage.json \
            artifacts/backend-test/tenant-isolation-audit.log
          do
            if [ ! -s "$path" ]; then
              echo "missing_or_empty=$path" | tee -a "$manifest"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit "$missing"
          fi
          set +e
          python3 - "$manifest" <<'PY' | tee -a "$manifest"
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path(sys.argv[1])
          unit_junit = Path("artifacts/backend-test/backend-unit.xml")
          coverage_xml = Path("artifacts/backend-test/backend-coverage.xml")
          coverage_json = Path("artifacts/backend-test/backend-coverage.json")

          errors: list[str] = []

          try:
              junit_root = ET.parse(unit_junit).getroot()
          except ET.ParseError as exc:
              errors.append(f"invalid_unit_junit_xml={unit_junit} error={exc}")
              junit_root = None

          if junit_root is not None:
              testcases = junit_root.findall(".//testcase")
              failures = junit_root.findall(".//failure")
              junit_errors = junit_root.findall(".//error")
              skipped = junit_root.findall(".//skipped")
              print(
                  "unit_junit_counts "
                  f"testcases={len(testcases)} "
                  f"failures={len(failures)} "
                  f"errors={len(junit_errors)} "
                  f"skipped={len(skipped)}"
              )
              if not testcases:
                  errors.append(f"unit_junit_no_testcases={unit_junit}")
              if failures:
                  errors.append(f"unit_junit_failures={unit_junit} count={len(failures)}")
              if junit_errors:
                  errors.append(f"unit_junit_errors={unit_junit} count={len(junit_errors)}")
              if skipped:
                  errors.append(f"unit_junit_skipped={unit_junit} count={len(skipped)}")

          try:
              coverage_root = ET.parse(coverage_xml).getroot()
          except ET.ParseError as exc:
              errors.append(f"invalid_coverage_xml={coverage_xml} error={exc}")
              coverage_root = None

          if coverage_root is not None:
              lines_valid = int(coverage_root.attrib.get("lines-valid", "0"))
              line_rate = float(coverage_root.attrib.get("line-rate", "-1"))
              branches_valid = int(coverage_root.attrib.get("branches-valid", "0"))
              branch_rate = float(coverage_root.attrib.get("branch-rate", "-1"))
              print(
                  "coverage_xml_counts "
                  f"lines_valid={lines_valid} "
                  f"line_rate={line_rate:.4f} "
                  f"branches_valid={branches_valid} "
                  f"branch_rate={branch_rate:.4f}"
              )
              if lines_valid <= 0:
                  errors.append(f"coverage_xml_no_lines={coverage_xml}")
              if not (0 <= line_rate <= 1):
                  errors.append(f"coverage_xml_invalid_line_rate={line_rate}")
              if branch_rate != -1 and not (0 <= branch_rate <= 1):
                  errors.append(f"coverage_xml_invalid_branch_rate={branch_rate}")

          try:
              coverage_data = json.loads(coverage_json.read_text())
          except json.JSONDecodeError as exc:
              errors.append(f"invalid_coverage_json={coverage_json} error={exc}")
              coverage_data = {}

          totals = coverage_data.get("totals", {})
          percent_covered = totals.get("percent_covered")
          num_statements = totals.get("num_statements", 0)
          covered_lines = totals.get("covered_lines", 0)
          print(
              "coverage_json_totals "
              f"num_statements={num_statements} "
              f"covered_lines={covered_lines} "
              f"percent_covered={percent_covered}"
          )
          if not isinstance(num_statements, int) or num_statements <= 0:
              errors.append(f"coverage_json_no_statements={coverage_json}")
          if not isinstance(covered_lines, int) or covered_lines <= 0:
              errors.append(f"coverage_json_no_covered_lines={coverage_json}")
          if not isinstance(percent_covered, (int, float)) or not (0 <= percent_covered <= 100):
              errors.append(f"coverage_json_invalid_percent={percent_covered}")

          if errors:
              for error in errors:
                  print(error)
              raise SystemExit(1)

          print("backend_test_artifacts_validation=passed")
          PY
          validation_status=${PIPESTATUS[0]}
          set -e
          if [ "$validation_status" -ne 0 ]; then
            exit "$validation_status"
          fi

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-artifacts
          path: artifacts/backend-test/
          if-no-files-found: error

  frontend-api-contract:
    runs-on: ubuntu-latest
    env:
      # Basic configuration (required for Settings initialization in export_openapi.py)
      QAP_DATABASE_URL: postgresql+asyncpg://localhost:5432/qaplatform
      QAP_REDIS_URL: redis://localhost:6379/0
      QAP_S3_ENDPOINT: http://localhost:9000
      QAP_S3_ACCESS_KEY: minioadmin
      QAP_S3_SECRET_KEY: minioadmin
      QAP_JWT_SECRET: test-secret-at-least-32bytes-long!
      QAP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies (from uv.lock)
        run: |
          python -m pip install uv
          uv lock --check
          uv export --frozen --extra dev --no-emit-project --no-hashes -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps -e .

      - name: Export OpenAPI contract
        run: python scripts/export_openapi.py

      - name: Validate frontend API contract
        run: pytest -q tests/unit/test_frontend_api_contract.py

      - name: Upload frontend API contract artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-api-contract-artifacts
          path: artifacts/frontend-api-contract/
          if-no-files-found: error

  backend-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Basic configuration (required for Settings initialization)
      QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
      QAP_REDIS_URL: redis://localhost:6379/0
      QAP_S3_ENDPOINT: http://localhost:9000
      QAP_S3_ACCESS_KEY: minioadmin
      QAP_S3_SECRET_KEY: minioadmin
      QAP_JWT_SECRET: test-secret-at-least-32bytes-long!
      QAP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Performance test configuration
      QAP_PERFORMANCE_GATE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.gate || 'nightly' }}
      PERF_EXTERNAL_STACK_WORKER_FIRST_SIGNAL_MS: "180000"
      PERF_EXTERNAL_STACK_WORKER_TERMINAL_MS: "240000"
      PERF_EXTERNAL_STACK_WORKER_ARCHIVE_READY_MS: "60000"
      PERF_EXTERNAL_STACK_WORKER_ARTIFACT_READY_MS: "30000"
      PERF_EXTERNAL_STACK_WORKER_ARTIFACT_DOWNLOAD_MS: "30000"
      PERF_EXTERNAL_STACK_WORKER_E2E_MS: "300000"
      PERF_EXTERNAL_STACK_WORKER_10_CONTAINERS_READY_MS: "240000"
      PERF_EXTERNAL_STACK_WORKER_10_CONTAINERS_TERMINAL_MS: "360000"
      PERF_READ_P99_MS: "100"
      PERF_WRITE_P99_MS: "300"
      PERF_TRIGGER_ENQUEUE_P99_MS: "5000"
      PERF_WEBHOOK_TRIGGER_ENQUEUE_P99_MS: "5000"
      PERF_SCHEDULE_TICK_ENQUEUE_P99_MS: "5000"
      PERF_DEQUEUE_WAITING_P99_MS: "5000"
      PERF_DEQUEUE_PRIORITY_PREEMPT_P99_MS: "5000"
      PERF_CANCEL_RUN_P99_MS: "1000"
      PERF_LOG_WRITE_P99_MS: "2000"
      PERF_SSE_TICKET_CREATE_P99_MS: "1000"
      PERF_SSE_LOG_DELIVERY_P99_MS: "2000"
      PERF_SSE_EVENT_DELIVERY_P99_MS: "2000"
      PERF_LOG_ARCHIVE_READ_P99_MS: "1000"
      PERF_LOG_ARCHIVE_LARGE_PAGE_P99_MS: "1500"
      PERF_LOG_ARCHIVE_MISSING_P99_MS: "1000"
      PERF_LOG_ARCHIVE_UNAVAILABLE_P99_MS: "1000"
      PERF_LOG_ARCHIVE_DENIED_P99_MS: "1000"
      PERF_ARTIFACT_LIST_P99_MS: "1000"
      PERF_ARTIFACT_LIST_LARGE_PAGE_P99_MS: "1500"
      PERF_ARTIFACT_LIST_DENIED_P99_MS: "1000"
      PERF_ARTIFACT_DOWNLOAD_URL_P99_MS: "1000"
      PERF_ARTIFACT_DOWNLOAD_UNAVAILABLE_P99_MS: "1000"
      PERF_ARTIFACT_DOWNLOAD_BURST_P99_MS: "1500"
      PERF_ARTIFACT_DOWNLOAD_DENIED_P99_MS: "1000"
      PERF_AUDIT_EVENTS_LIST_P99_MS: "1000"
      PERF_AUDIT_EVENTS_LARGE_FILTERED_PAGE_P99_MS: "2000"
      PERF_AUDIT_EVENTS_DENIED_P99_MS: "1000"
      PERF_AUDIT_EVENTS_API_TOKEN_DENIED_P99_MS: "1000"
      PERF_RUN_READ_EMPTY_SCOPE_DENIED_P99_MS: "1000"
      PERF_REAL_TOKEN_CONCURRENT_READ_PATHS_P99_MS: "3000"
      PERF_EXECUTION_SUMMARY_P99_MS: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize backend integration artifacts
        shell: bash
        run: |
          mkdir -p artifacts/backend-integration
          {
            echo "job=backend-integration-test"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
          } > artifacts/backend-integration/manifest.txt

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies (from uv.lock)
        run: |
          python -m pip install uv
          uv lock --check
          uv export --frozen --extra dev --no-emit-project --no-hashes -o requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install --no-deps -e .

      - name: Validate OpenAPI API test matrix
        run: |
          python scripts/validate_api_test_matrix.py
          python scripts/validate_api_test_case_matrix.py

      - name: Write API test quality report
        run: |
          python scripts/report_api_test_quality.py \
            --output-dir artifacts/backend-integration/api-test-quality

      - name: Run required integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/ \
            -m "not heavy_docker and not external_stack and not performance and not openapi_contract" \
            --collect-only -q \
            2>&1 | tee artifacts/backend-integration/required-integration-collect.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          pytest tests/integration/ \
            -m "not heavy_docker and not external_stack and not performance and not openapi_contract" \
            -v \
            --junitxml=artifacts/backend-integration/required-integration.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/required-integration.log
          status=$?
          set -e
          exit "$status"

      - name: Run OpenAPI contract smoke
        env:
          RUN_INTEGRATION_TESTS: "1"
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/test_openapi_contract_smoke.py \
            -m "openapi_contract" \
            --collect-only -q \
            2>&1 | tee artifacts/backend-integration/openapi-contract-collect.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          python scripts/export_openapi.py artifacts/backend-integration/openapi-contract-openapi.json
          status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          pytest tests/integration/test_openapi_contract_smoke.py \
            -m "openapi_contract" \
            -v \
            --junitxml=artifacts/backend-integration/openapi-contract.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/openapi-contract.log
          status=$?
          set -e
          exit "$status"

      - name: Pull heavy docker images (nightly/release candidate, with retry)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate'))
        run: |
          for image in alpine:3.19 python:3.12-alpine; do
            pulled=0
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                pulled=1
                break
              fi
              echo "Pull attempt $attempt failed for $image, retrying..."
              sleep 10
            done
            if [ "$pulled" -ne 1 ]; then
              echo "Failed to pull $image after 3 attempts"
              exit 1
            fi
          done

      - name: Run heavy docker integration tests (nightly/release candidate)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate'))
        env:
          RUN_INTEGRATION_TESTS: "1"
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.gate }}" = "release_candidate" ]; then
            export QAP_TEST_OOM=1
          fi
          set +e
          set -o pipefail
          pytest tests/integration/ \
            -m "heavy_docker and not external_stack" \
            --collect-only -q \
            2>&1 | tee artifacts/backend-integration/heavy-docker-integration-collect.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          pytest tests/integration/ \
            -m "heavy_docker and not external_stack" \
            -v \
            --junitxml=artifacts/backend-integration/heavy-docker-integration.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/heavy-docker-integration.log
          status=$?
          set -e
          exit "$status"

      - name: Prepare external API/worker stack env (nightly/release candidate)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate'))
        run: |
          cp .env.example .env
          sed -i 's/^QAP_MAX_CONCURRENT_RUNS=.*/QAP_MAX_CONCURRENT_RUNS=10/' .env
          sed -i 's/^QAP_MAX_CONCURRENT_PER_PROJECT=.*/QAP_MAX_CONCURRENT_PER_PROJECT=10/' .env
          sed -i 's/^QAP_WORKER_MAX_JOBS=.*/QAP_WORKER_MAX_JOBS=10/' .env
          echo "QAP_DOCKER_SOCK_GROUP_ID=$(stat -c '%g' /var/run/docker.sock)" >> .env
          mkdir -p "$PWD/.qap-workspaces"
          chmod 777 "$PWD/.qap-workspaces"
          echo "QAP_RUN_WORKSPACE_DIR=$PWD/.qap-workspaces" >> .env

      - name: Start external API/worker stack (nightly/release candidate)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate'))
        run: |
          docker compose up -d --build postgres redis minio minio-init api worker worker-high worker-low
          # docker-compose 把 api 映射到宿主 8001（容器内仍是 8000），
          # 不是 8000——用错端口会让这个循环空转 36 次后必然失败
          for attempt in {1..36}; do
            if curl -fsS http://localhost:8001/ready; then
              docker compose exec -T api python -m alembic upgrade head
              docker compose exec -T \
                -e ADMIN_USERNAME=admin \
                -e ADMIN_PASSWORD=admin123 \
                -e ADMIN_EMAIL=admin@qaplatform.local \
                api python scripts/seed_admin.py
              exit 0
            fi
            docker compose ps
            sleep 5
          done
          docker compose ps > artifacts/backend-integration/external-stack-startup-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps --tail=200 \
            postgres redis minio minio-init api worker worker-high worker-low \
            2>&1 | tee artifacts/backend-integration/external-stack-startup.log
          exit 1

      - name: Run external-stack worker integration tests (nightly/release candidate)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate'))
        env:
          RUN_INTEGRATION_TESTS: "1"
          QAP_EXTERNAL_STACK_REQUIRED: "1"
          # 测试默认连 localhost:8000，而 compose 把 api 映射到宿主 8001
          QAP_API_URL: http://localhost:8001
          QAP_EXTERNAL_STACK_GIT_URL: https://github.com/octocat/Hello-World.git
          QAP_EXTERNAL_STACK_GIT_REF: master
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/ \
            -m "external_stack and not performance" \
            --collect-only -q \
            2>&1 | tee artifacts/backend-integration/external-stack-integration-collect.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          pytest tests/integration/ \
            -m "external_stack and not performance" \
            -v \
            --junitxml=artifacts/backend-integration/external-stack-integration.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/external-stack-integration.log
          status=$?
          set -e
          exit "$status"

      - name: Run external-stack worker performance smoke (nightly/release candidate)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate'))
        env:
          RUN_INTEGRATION_TESTS: "1"
          RUN_PERFORMANCE_TESTS: "1"
          QAP_EXTERNAL_STACK_REQUIRED: "1"
          # 测试默认连 localhost:8000，而 compose 把 api 映射到宿主 8001
          QAP_API_URL: http://localhost:8001
          QAP_EXTERNAL_STACK_GIT_URL: https://github.com/octocat/Hello-World.git
          QAP_EXTERNAL_STACK_GIT_REF: master
          QAP_PERFORMANCE_SUMMARY_JSONL: artifacts/backend-integration/performance-smoke-summary.jsonl
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/test_worker_execute.py \
            -m "external_stack and performance" \
            --collect-only -q \
            2>&1 | tee artifacts/backend-integration/external-stack-performance-collect.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          pytest tests/integration/test_worker_execute.py \
            -m "external_stack and performance" \
            -v \
            --junitxml=artifacts/backend-integration/external-stack-performance.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/external-stack-performance.log
          status=$?
          set -e
          exit "$status"

      - name: Collect external stack logs (nightly/release candidate)
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate')))
        run: |
          docker compose ps > artifacts/backend-integration/external-stack-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps --tail=500 \
            postgres redis minio minio-init api worker worker-high worker-low \
            > artifacts/backend-integration/external-stack-docker.log 2>&1 || true

      - name: Stop external API/worker stack (nightly/release candidate)
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate')))
        run: docker compose down -v || true

      - name: Run backend performance smoke (nightly/release candidate)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate'))
        env:
          RUN_INTEGRATION_TESTS: "1"
          RUN_PERFORMANCE_TESTS: "1"
          QAP_PERFORMANCE_SUMMARY_JSONL: artifacts/backend-integration/performance-smoke-summary.jsonl
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/integration/test_performance_smoke.py \
            -m "performance" \
            --collect-only -q \
            2>&1 | tee artifacts/backend-integration/performance-smoke-collect.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          pytest tests/integration/test_performance_smoke.py \
            -m "performance" \
            -v \
            --junitxml=artifacts/backend-integration/performance-smoke.xml \
            --tb=short \
            --durations=20 \
            2>&1 | tee artifacts/backend-integration/performance-smoke.log
          status=$?
          set -e
          exit "$status"

      - name: Write performance smoke summary artifact (nightly/release candidate)
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate')))
        shell: bash
        run: |
          {
            echo "# Performance Smoke Summary"
            echo
            echo "- event: ${GITHUB_EVENT_NAME}"
            echo "- gate_profile: ${{ github.event_name == 'workflow_dispatch' && inputs.gate || 'nightly' }}"
            echo "- sha: ${GITHUB_SHA}"
            echo
            if [ -f artifacts/backend-integration/performance-smoke-summary.jsonl ]; then
              echo '```json'
              cat artifacts/backend-integration/performance-smoke-summary.jsonl
              echo '```'
            else
              echo "No performance summary JSONL was generated before the test process ended."
            fi
          } > artifacts/backend-integration/performance-smoke-summary.md

      - name: Validate backend integration artifacts
        if: always()
        shell: bash
        run: |
          set -o pipefail
          manifest=artifacts/backend-integration/evidence-manifest.txt
          {
            echo "# backend-integration evidence manifest"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            find artifacts/backend-integration -type f -print | sort
          } > "$manifest"

          expected=(
            artifacts/backend-integration/api-test-quality/index.md
            artifacts/backend-integration/api-test-quality/summary.json
            artifacts/backend-integration/required-integration-collect.txt
            artifacts/backend-integration/required-integration.log
            artifacts/backend-integration/required-integration.xml
            artifacts/backend-integration/openapi-contract-collect.txt
            artifacts/backend-integration/openapi-contract.log
            artifacts/backend-integration/openapi-contract.xml
            artifacts/backend-integration/openapi-contract-openapi.json
          )
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && { [ "${{ inputs.gate }}" = "nightly" ] || [ "${{ inputs.gate }}" = "release_candidate" ]; }; }; then
            expected+=(
              artifacts/backend-integration/heavy-docker-integration-collect.txt
              artifacts/backend-integration/heavy-docker-integration.log
              artifacts/backend-integration/heavy-docker-integration.xml
              artifacts/backend-integration/external-stack-docker.log
              artifacts/backend-integration/external-stack-ps.txt
              artifacts/backend-integration/external-stack-integration-collect.txt
              artifacts/backend-integration/external-stack-integration.log
              artifacts/backend-integration/external-stack-integration.xml
              artifacts/backend-integration/external-stack-performance-collect.txt
              artifacts/backend-integration/external-stack-performance.log
              artifacts/backend-integration/external-stack-performance.xml
              artifacts/backend-integration/performance-smoke-collect.txt
              artifacts/backend-integration/performance-smoke.log
              artifacts/backend-integration/performance-smoke.xml
              artifacts/backend-integration/performance-smoke-summary.jsonl
              artifacts/backend-integration/performance-smoke-summary.md
            )
          fi

          missing=0
          for path in "${expected[@]}"; do
            if [ ! -s "$path" ]; then
              echo "missing_or_empty=$path" | tee -a "$manifest"
              missing=1
            fi
          done

          collect_paths=()
          for path in "${expected[@]}"; do
            if [[ "$path" == *-collect.txt ]]; then
              collect_paths+=("$path")
            fi
          done
          if ! python - "$manifest" "${collect_paths[@]}" <<'PY' | tee -a "$manifest"; then
          import re
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          collect_paths = [Path(path) for path in sys.argv[2:]]
          minimums = {
              "required-integration-collect.txt": 167,
              "openapi-contract-collect.txt": 72,
              "heavy-docker-integration-collect.txt": 12,
              "external-stack-integration-collect.txt": 6,
              "external-stack-performance-collect.txt": 2,
              "performance-smoke-collect.txt": 31,
          }
          errors = []

          with manifest_path.open("a", encoding="utf-8") as manifest:
              for collect_path in collect_paths:
                  if not collect_path.exists() or collect_path.stat().st_size == 0:
                      errors.append(f"missing_collect_manifest={collect_path}")
                      continue
                  text = collect_path.read_text(encoding="utf-8")
                  nodeids = [
                      line.strip()
                      for line in text.splitlines()
                      if line.startswith("tests/") and "::" in line
                  ]
                  files = sorted({line.split("::", 1)[0] for line in nodeids})
                  total_match = re.search(r"(\d+)(?:/\d+)? tests? collected", text)
                  reported = int(total_match.group(1)) if total_match else None
                  minimum = minimums.get(collect_path.name, 1)
                  manifest.write(
                      f"collect_counts path={collect_path} "
                      f"nodeids={len(nodeids)} files={len(files)} reported={reported} minimum={minimum}\n"
                  )
                  if len(nodeids) < minimum:
                      errors.append(
                          f"collect_count_below_minimum={collect_path} "
                          f"minimum={minimum} actual={len(nodeids)}"
                      )
                  if reported is not None and reported != len(nodeids):
                      errors.append(
                          f"collect_report_mismatch={collect_path} "
                          f"reported={reported} nodeids={len(nodeids)}"
                      )

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"collect_validation=passed files={len(collect_paths)}")
          PY
            missing=1
          fi

          junit_paths=()
          for path in "${expected[@]}"; do
            if [[ "$path" == *.xml ]]; then
              junit_paths+=("$path")
            fi
          done
          strict_junit_skips=0
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.gate }}" = "release_candidate" ]; then
            strict_junit_skips=1
          fi
          allow_nightly_oom_skips=0
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.gate }}" = "nightly" ]; }; then
            allow_nightly_oom_skips=1
          fi
          if ! STRICT_JUNIT_SKIPS="$strict_junit_skips" ALLOW_NIGHTLY_OOM_SKIPS="$allow_nightly_oom_skips" python - "$manifest" "${junit_paths[@]}" <<'PY' | tee -a "$manifest"; then
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          junit_paths = [Path(path) for path in sys.argv[2:]]
          strict_skips = os.environ.get("STRICT_JUNIT_SKIPS") == "1"
          allow_nightly_oom_skips = os.environ.get("ALLOW_NIGHTLY_OOM_SKIPS") == "1"
          allowed_nightly_oom_skip_names = {
              "test_oom_kill_sets_oom_killed_true",
              "test_normal_exit_oom_killed_false",
              "test_executor_maps_real_oom_to_timeout_summary_and_redis",
          }
          errors = []

          with manifest_path.open("a", encoding="utf-8") as manifest:
              for junit_path in junit_paths:
                  if not junit_path.exists() or junit_path.stat().st_size == 0:
                      errors.append(f"missing_junit={junit_path}")
                      continue
                  try:
                      root = ET.parse(junit_path).getroot()
                  except ET.ParseError as exc:
                      errors.append(f"invalid_junit_xml={junit_path} error={exc}")
                      continue
                  testcases = root.findall(".//testcase")
                  failures = root.findall(".//failure")
                  junit_errors = root.findall(".//error")
                  skipped_cases = [
                      case for case in testcases if case.find("skipped") is not None
                  ]
                  manifest.write(
                      f"junit_counts path={junit_path} "
                      f"testcases={len(testcases)} "
                      f"failures={len(failures)} "
                      f"errors={len(junit_errors)} "
                      f"skipped={len(skipped_cases)}\n"
                  )
                  if not testcases:
                      errors.append(f"junit_no_testcases={junit_path}")
                  if len(testcases) == len(skipped_cases):
                      errors.append(f"junit_all_skipped={junit_path}")
                  if failures:
                      errors.append(f"junit_failures={junit_path} count={len(failures)}")
                  if junit_errors:
                      errors.append(f"junit_errors={junit_path} count={len(junit_errors)}")
                  for case in skipped_cases:
                      name = case.attrib.get("name")
                      classname = case.attrib.get("classname")
                      allowed_nightly_oom_skip = (
                          allow_nightly_oom_skips
                          and junit_path.name == "heavy-docker-integration.xml"
                          and classname == "tests.integration.test_oom_e2e"
                          and name in allowed_nightly_oom_skip_names
                      )
                      if strict_skips or not allowed_nightly_oom_skip:
                          errors.append(
                              f"junit_skipped={junit_path} classname={classname} name={name}"
                          )

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(
              "junit_validation="
              f"strict_skips={strict_skips} "
              f"allow_nightly_oom_skips={allow_nightly_oom_skips} "
              f"files={len(junit_paths)}"
          )
          PY
            missing=1
          fi

          if ! python scripts/report_integration_skips.py \
            artifacts/backend-integration/integration-skip-inventory.json \
            artifacts/backend-integration/integration-skip-inventory.md \
            "${junit_paths[@]}" | tee -a "$manifest"; then
            missing=1
          fi

          if ! STRICT_JUNIT_SKIPS="$strict_junit_skips" ALLOW_NIGHTLY_OOM_SKIPS="$allow_nightly_oom_skips" python scripts/validate_backend_integration_artifacts.py \
            "$manifest" \
            "${collect_paths[@]}" | tee -a "$manifest"; then
            missing=1
          fi

          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && { [ "${{ inputs.gate }}" = "nightly" ] || [ "${{ inputs.gate }}" = "release_candidate" ]; }; }; then
            summary=artifacts/backend-integration/performance-smoke-summary.jsonl
            slo_manifest=.github/performance-slo-manifest.json
            thresholds=artifacts/backend-integration/performance-thresholds.json
            baseline=.github/performance-slo-baseline.json
            trend=artifacts/backend-integration/performance-trend.json

            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              expected_gate_profile="${{ inputs.gate }}"
            else
              expected_gate_profile="nightly"
            fi
            if ! python scripts/validate_performance_summary.py \
              "$summary" \
              "$slo_manifest" \
              "$thresholds" \
              "$expected_gate_profile" \
              "$baseline" \
              "$trend" | tee -a "$manifest"; then
              missing=1
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.gate }}" = "release_candidate" ]; then
            if ! python - artifacts/backend-integration/heavy-docker-integration.xml <<'PY' | tee -a "$manifest"; then
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path(sys.argv[1])
          required = {
              "test_executor_maps_real_oom_to_timeout_summary_and_redis",
              "test_oom_kill_sets_oom_killed_true",
              "test_normal_exit_oom_killed_false",
          }
          errors = []
          if not xml_path.exists():
              errors.append(f"missing_heavy_docker_junit={xml_path}")
          else:
              tree = ET.parse(xml_path)
              cases = {
                  case.attrib.get("name"): case
                  for case in tree.iter("testcase")
                  if case.attrib.get("classname") == "tests.integration.test_oom_e2e"
              }
              for name in sorted(required):
                  case = cases.get(name)
                  if case is None:
                      errors.append(f"missing_release_candidate_oom_test={name}")
                      continue
                  if case.find("skipped") is not None:
                      errors.append(f"skipped_release_candidate_oom_test={name}")
                  if case.find("failure") is not None or case.find("error") is not None:
                      errors.append(f"failed_release_candidate_oom_test={name}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("release_candidate_oom_tests=passed")
          PY
              missing=1
            fi
          fi
          exit "$missing"

      - name: Upload backend integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-artifacts
          path: artifacts/backend-integration/
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install root test dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies (from uv.lock)
        run: |
          python -m pip install uv
          uv lock --check
          uv export --frozen --no-emit-project --no-hashes -o requirements.ci.txt
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.ci.txt
          .venv/bin/python -m pip install --no-deps -e .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Pull E2E worker images (nightly/release candidate, with retry)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.gate == 'nightly' || inputs.gate == 'release_candidate'))
        run: |
          for image in python:3.12-alpine; do
            pulled=0
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                pulled=1
                break
              fi
              echo "Pull attempt $attempt failed for $image, retrying..."
              sleep 10
            done
            if [ "$pulled" -ne 1 ]; then
              echo "Failed to pull $image after 3 attempts"
              exit 1
            fi
          done

      - name: Create .env for docker-compose (api/worker services reference it)
        run: |
          cat > .env <<'EOF'
          QAP_DATABASE_URL=postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
          QAP_REDIS_URL=redis://localhost:6379/0
          QAP_S3_ENDPOINT=http://localhost:9000
          QAP_S3_ACCESS_KEY=minioadmin
          QAP_S3_SECRET_KEY=minioadmin
          QAP_JWT_SECRET=ci-test-jwt-secret-not-for-production-use
          QAP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF
          echo "QAP_DOCKER_SOCK_GROUP_ID=$(stat -c '%g' /var/run/docker.sock)" >> .env
          mkdir -p "$PWD/.qap-workspaces"
          chmod 777 "$PWD/.qap-workspaces"
          echo "QAP_RUN_WORKSPACE_DIR=$PWD/.qap-workspaces" >> .env
          mkdir -p artifacts/e2e

      - name: Start external stack for E2E (release candidate)
        if: github.event_name == 'workflow_dispatch' && inputs.gate == 'release_candidate'
        run: |
          docker compose up -d --build postgres redis minio minio-init api worker
          # docker-compose 把 api 映射到宿主 8001（容器内仍是 8000），
          # 不是 8000——用错端口会让这个循环空转 36 次后必然失败
          for attempt in {1..36}; do
            if curl -fsS http://localhost:8001/ready; then
              docker compose exec -T api python -m alembic upgrade head
              docker compose exec -T \
                -e ADMIN_USERNAME=admin \
                -e ADMIN_PASSWORD=admin123 \
                -e ADMIN_EMAIL=admin@qaplatform.local \
                api python scripts/seed_admin.py
              exit 0
            fi
            docker compose ps
            sleep 5
          done
          docker compose ps > artifacts/e2e/external-stack-startup-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps --tail=200 \
            postgres redis minio minio-init api worker \
            2>&1 | tee artifacts/e2e/external-stack-startup.log
          exit 1

      - name: Run E2E tests
        env:
          E2E_ADMIN_PASSWORD: admin123
          QAP_DATABASE_URL: postgresql+asyncpg://qaplatform:qaplatform@localhost:5432/qaplatform
          QAP_REDIS_URL: redis://localhost:6379/0
          QAP_S3_ENDPOINT: http://localhost:9000
          QAP_S3_ACCESS_KEY: minioadmin
          QAP_S3_SECRET_KEY: minioadmin
          QAP_S3_BUCKET: qa-platform
          QAP_JWT_SECRET: ci-test-jwt-secret-not-for-production-use
          QAP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          mkdir -p artifacts/e2e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.gate }}" = "release_candidate" ]; then
            export QAP_E2E_WORKER=1
            export QAP_WORKER_MAX_JOBS=1
            export QAP_EXTERNAL_STACK_GIT_URL=https://github.com/octocat/Hello-World.git
            export QAP_EXTERNAL_STACK_GIT_REF=master
            export QAP_E2E_EXTERNAL_STACK=1
            find tests/e2e -maxdepth 1 -name '*.spec.ts' -print | sort > artifacts/e2e/e2e-specs.txt
            npx playwright test --list --reporter=json > artifacts/e2e/e2e-tests.json
            npx playwright test --list | tee artifacts/e2e/e2e-tests.txt
            npm run test:e2e
          elif [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.gate }}" = "nightly" ]; }; then
            export QAP_E2E_WORKER=1
            export QAP_WORKER_MAX_JOBS=1
            export QAP_EXTERNAL_STACK_GIT_URL=https://github.com/octocat/Hello-World.git
            export QAP_EXTERNAL_STACK_GIT_REF=master
            printf '%s\n' \
              tests/e2e/real-login-flow.spec.ts \
              tests/e2e/real-run-trigger.spec.ts \
              tests/e2e/special-regressions.spec.ts \
              > artifacts/e2e/e2e-specs.txt
            npx playwright test --list --reporter=json tests/e2e/real-login-flow.spec.ts tests/e2e/real-run-trigger.spec.ts tests/e2e/special-regressions.spec.ts > artifacts/e2e/e2e-tests.json
            npx playwright test --list tests/e2e/real-login-flow.spec.ts tests/e2e/real-run-trigger.spec.ts tests/e2e/special-regressions.spec.ts | tee artifacts/e2e/e2e-tests.txt
            npm run test:e2e -- tests/e2e/real-login-flow.spec.ts tests/e2e/real-run-trigger.spec.ts tests/e2e/special-regressions.spec.ts
          else
            printf '%s\n' tests/e2e/auth-flow.spec.ts > artifacts/e2e/e2e-specs.txt
            npx playwright test --list --reporter=json tests/e2e/auth-flow.spec.ts > artifacts/e2e/e2e-tests.json
            npx playwright test --list tests/e2e/auth-flow.spec.ts | tee artifacts/e2e/e2e-tests.txt
            npm run test:e2e -- tests/e2e/auth-flow.spec.ts
          fi

      - name: Validate E2E evidence
        if: always()
        run: |
          set -euo pipefail
          manifest=artifacts/e2e/evidence-manifest.txt
          specs=artifacts/e2e/e2e-specs.txt
          tests_list=artifacts/e2e/e2e-tests.txt
          tests_json=artifacts/e2e/e2e-tests.json
          run_json=artifacts/e2e/playwright-run.json
          junit=artifacts/e2e/playwright-results.xml
          html=artifacts/e2e/playwright-report/index.html
          : > "$manifest"

          require_nonempty() {
            if [ ! -s "$1" ]; then
              echo "missing_or_empty=$1" | tee -a "$manifest"
              exit 1
            fi
            echo "file=$1 bytes=$(wc -c < "$1")" >> "$manifest"
          }

          require_nonempty "$specs"
          require_nonempty "$tests_list"
          require_nonempty "$tests_json"
          require_nonempty "$run_json"
          require_nonempty "$junit"
          require_nonempty "$html"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.gate }}" = "release_candidate" ]; then
            mode=release_candidate
            find tests/e2e -maxdepth 1 -name '*.spec.ts' -print | sort > /tmp/expected-e2e-specs.txt
            for required_spec in \
              tests/e2e/auth-flow.spec.ts \
              tests/e2e/real-login-flow.spec.ts \
              tests/e2e/real-run-trigger.spec.ts \
              tests/e2e/special-regressions.spec.ts
            do
              if ! grep -Fxq "$required_spec" /tmp/expected-e2e-specs.txt; then
                echo "missing_release_candidate_required_e2e_spec=$required_spec" | tee -a "$manifest"
                exit 1
              fi
            done
          elif [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.gate }}" = "nightly" ]; }; then
            mode=nightly
            printf '%s\n' \
              tests/e2e/real-login-flow.spec.ts \
              tests/e2e/real-run-trigger.spec.ts \
              tests/e2e/special-regressions.spec.ts \
              > /tmp/expected-e2e-specs.txt
          else
            mode=pr_like
            printf '%s\n' tests/e2e/auth-flow.spec.ts > /tmp/expected-e2e-specs.txt
          fi

          if ! cmp -s /tmp/expected-e2e-specs.txt "$specs"; then
            echo "unexpected_e2e_specs mode=$mode" | tee -a "$manifest"
            echo "expected:" | tee -a "$manifest"
            sed 's/^/  /' /tmp/expected-e2e-specs.txt | tee -a "$manifest"
            echo "actual:" | tee -a "$manifest"
            sed 's/^/  /' "$specs" | tee -a "$manifest"
            exit 1
          fi

          python - "$junit" "$tests_list" "$tests_json" "$run_json" "$specs" "$manifest" <<'PY'
          from collections import Counter
          import json
          import re
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          junit_path, tests_list_path, tests_json_path, run_json_path, specs_path, manifest_path = sys.argv[1:]
          TITLE_SEPARATOR = " \u203a "
          tests_list = open(tests_list_path, encoding="utf-8").read()
          total_match = re.search(r"^Total:\s+(\d+)\s+tests?\s+in\s+(\d+)\s+files?$", tests_list, re.M)
          if total_match is None:
              raise SystemExit("playwright test list did not include a parseable Total line")
          expected_testcases = int(total_match.group(1))
          expected_files = int(total_match.group(2))
          if expected_testcases <= 0 or expected_files <= 0:
              raise SystemExit("playwright test list reported no runnable tests")

          def normalize_spec(path: str) -> str:
              prefix = "tests/e2e/"
              return path[len(prefix):] if path.startswith(prefix) else path

          expected_specs = [
              normalize_spec(line.strip())
              for line in Path(specs_path).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if len(set(expected_specs)) != len(expected_specs):
              raise SystemExit("e2e spec list contains duplicate entries")

          list_data = json.loads(Path(tests_json_path).read_text(encoding="utf-8"))
          discovered_counts: dict[str, int] = {}
          discovered_titles: dict[str, list[str]] = {}
          discovered_junit_titles: dict[str, list[str]] = {}

          def expected_junit_title(file_name, suite_titles, title):
              title_parts = [
                  suite_title
                  for suite_title in suite_titles
                  if suite_title and suite_title != file_name
              ]
              title_parts.append(title)
              return TITLE_SEPARATOR.join(title_parts)

          def walk_suites(suites, suite_titles=()):
              for suite in suites or []:
                  suite_title = suite.get("title")
                  next_suite_titles = (
                      (*suite_titles, suite_title)
                      if suite_title
                      else suite_titles
                  )
                  for spec in suite.get("specs") or []:
                      file_name = spec.get("file")
                      title = spec.get("title")
                      tests = spec.get("tests") or []
                      if file_name:
                          discovered_counts[file_name] = discovered_counts.get(file_name, 0) + len(tests)
                          if title and tests:
                              discovered_titles.setdefault(file_name, []).extend(
                                  [title] * len(tests)
                              )
                              discovered_junit_titles.setdefault(file_name, []).extend(
                                  [expected_junit_title(file_name, next_suite_titles, title)] * len(tests)
                              )
                  yield from walk_suites(suite.get("suites"), next_suite_titles)

          list(walk_suites(list_data.get("suites")))
          discovery_errors = []
          if sum(discovered_counts.values()) != expected_testcases:
              discovery_errors.append(
                  "playwright_list_count_mismatch="
                  f"text_total={expected_testcases} json_total={sum(discovered_counts.values())}"
              )
          if len(discovered_counts) != expected_files:
              discovery_errors.append(
                  f"playwright_list_file_count_mismatch=text_files={expected_files} json_files={len(discovered_counts)}"
              )
          for spec in expected_specs:
              if discovered_counts.get(spec, 0) < 1:
                  discovery_errors.append(f"playwright_spec_without_tests={spec}")
          for spec in sorted(set(discovered_counts) - set(expected_specs)):
              discovery_errors.append(f"unexpected_playwright_spec={spec}")
          if discovery_errors:
              raise SystemExit("\n".join(discovery_errors))

          run_data = json.loads(Path(run_json_path).read_text(encoding="utf-8"))
          actual_counts: dict[str, int] = {}
          actual_titles: dict[str, list[str]] = {}
          actual_junit_titles: dict[str, list[str]] = {}
          actual_missing_results: list[str] = []
          result_status_counts: dict[str, int] = {}

          def walk_actual_suites(suites, suite_titles=()):
              for suite in suites or []:
                  suite_title = suite.get("title")
                  next_suite_titles = (
                      (*suite_titles, suite_title)
                      if suite_title
                      else suite_titles
                  )
                  for spec in suite.get("specs") or []:
                      file_name = spec.get("file")
                      title = spec.get("title")
                      tests = spec.get("tests") or []
                      if file_name:
                          actual_counts[file_name] = actual_counts.get(file_name, 0) + len(tests)
                          if title and tests:
                              actual_titles.setdefault(file_name, []).extend(
                                  [title] * len(tests)
                              )
                              actual_junit_titles.setdefault(file_name, []).extend(
                                  [expected_junit_title(file_name, next_suite_titles, title)] * len(tests)
                              )
                      for case in tests:
                          project = case.get("projectName") or case.get("projectId") or "unknown-project"
                          results = case.get("results") or []
                          if not results:
                              actual_missing_results.append(f"{file_name}::{title}::{project}")
                          for result in results:
                              status = result.get("status", "unknown")
                              result_status_counts[status] = result_status_counts.get(status, 0) + 1
                  yield from walk_actual_suites(suite.get("suites"), next_suite_titles)

          list(walk_actual_suites(run_data.get("suites")))
          run_stats = run_data.get("stats") or {}
          actual_errors = []
          if sum(actual_counts.values()) != expected_testcases:
              actual_errors.append(
                  "playwright_actual_count_mismatch="
                  f"expected={expected_testcases} actual={sum(actual_counts.values())}"
              )
          for spec in expected_specs:
              expected_for_spec = discovered_counts.get(spec, 0)
              actual_for_spec = actual_counts.get(spec, 0)
              if actual_for_spec != expected_for_spec:
                  actual_errors.append(
                      "playwright_actual_spec_count_mismatch="
                      f"{spec} expected={expected_for_spec} actual={actual_for_spec}"
                  )
              expected_titles = discovered_titles.get(spec, [])
              actual_run_titles = actual_titles.get(spec, [])
              if Counter(actual_run_titles) != Counter(expected_titles):
                  actual_errors.append(
                      "playwright_actual_spec_title_mismatch="
                      f"{spec} expected={sorted(expected_titles)!r} actual={sorted(actual_run_titles)!r}"
                  )
              expected_junit_names = discovered_junit_titles.get(spec, [])
              actual_junit_names = actual_junit_titles.get(spec, [])
              if Counter(actual_junit_names) != Counter(expected_junit_names):
                  actual_errors.append(
                      "playwright_actual_spec_full_title_mismatch="
                      f"{spec} expected={sorted(expected_junit_names)!r} actual={sorted(actual_junit_names)!r}"
                  )
          for spec in sorted(set(actual_counts) - set(expected_specs)):
              actual_errors.append(f"unexpected_playwright_actual_spec={spec}")
          if actual_missing_results:
              actual_errors.append(
                  "playwright_actual_missing_result="
                  f"{json.dumps(actual_missing_results, ensure_ascii=False)}"
              )
          actual_expected = int(run_stats.get("expected", -1))
          actual_unexpected = int(run_stats.get("unexpected", -1))
          actual_flaky = int(run_stats.get("flaky", -1))
          actual_skipped = int(run_stats.get("skipped", -1))
          if actual_expected != expected_testcases:
              actual_errors.append(f"playwright_actual_expected_count={actual_expected}")
          if actual_unexpected != 0:
              actual_errors.append(f"playwright_actual_unexpected_count={actual_unexpected}")
          if actual_flaky != 0:
              actual_errors.append(f"playwright_actual_flaky_count={actual_flaky}")
          if actual_skipped != 0:
              actual_errors.append(f"playwright_actual_skipped_count={actual_skipped}")
          unexpected_result_statuses = {
              status: count
              for status, count in result_status_counts.items()
              if status != "passed"
          }
          if unexpected_result_statuses:
              actual_errors.append(
                  "playwright_actual_unexpected_result_statuses="
                  f"{json.dumps(unexpected_result_statuses, sort_keys=True)}"
              )
          if actual_errors:
              raise SystemExit("\n".join(actual_errors))

          root = ET.parse(junit_path).getroot()
          testcases = root.findall(".//testcase")
          if not testcases:
              raise SystemExit("playwright junit contains no testcase rows")
          failures = root.findall(".//failure")
          errors = root.findall(".//error")
          skipped = root.findall(".//skipped")
          junit_counts: dict[str, int] = {}
          junit_titles: dict[str, list[str]] = {}
          for testcase in testcases:
              classname = testcase.attrib.get("classname")
              name = testcase.attrib.get("name")
              if classname:
                  junit_counts[classname] = junit_counts.get(classname, 0) + 1
                  if name:
                      junit_titles.setdefault(classname, []).append(name)
          with open(manifest_path, "a", encoding="utf-8") as fh:
              fh.write(f"expected_testcase_count={expected_testcases}\n")
              fh.write(f"expected_spec_file_count={expected_files}\n")
              for spec in expected_specs:
                  fh.write(f"expected_spec_test_count {spec}={discovered_counts.get(spec, 0)}\n")
                  fh.write(f"junit_spec_test_count {spec}={junit_counts.get(spec, 0)}\n")
                  fh.write(
                      f"expected_spec_titles {spec}="
                      f"{json.dumps(sorted(discovered_titles.get(spec, [])), ensure_ascii=False)}\n"
                  )
                  fh.write(
                      f"expected_junit_titles {spec}="
                      f"{json.dumps(sorted(discovered_junit_titles.get(spec, [])), ensure_ascii=False)}\n"
                  )
                  fh.write(
                      f"junit_spec_titles {spec}="
                      f"{json.dumps(sorted(junit_titles.get(spec, [])), ensure_ascii=False)}\n"
                  )
              fh.write(f"testcase_count={len(testcases)}\n")
              fh.write(f"failure_count={len(failures)}\n")
              fh.write(f"error_count={len(errors)}\n")
              fh.write(f"skipped_count={len(skipped)}\n")
              fh.write(f"actual_testcase_count={sum(actual_counts.values())}\n")
              fh.write(f"actual_expected_count={actual_expected}\n")
              fh.write(f"actual_unexpected_count={actual_unexpected}\n")
              fh.write(f"actual_flaky_count={actual_flaky}\n")
              fh.write(f"actual_skipped_count={actual_skipped}\n")
              for status, count in sorted(result_status_counts.items()):
                  fh.write(f"actual_result_status_count {status}={count}\n")
              fh.write("playwright_actual_run_validation=passed\n")
          errors_out = []
          if len(testcases) != expected_testcases:
              errors_out.append(
                  f"playwright_testcase_count_mismatch expected={expected_testcases} actual={len(testcases)}"
              )
          for spec in expected_specs:
              expected_for_spec = discovered_counts.get(spec, 0)
              actual_for_spec = junit_counts.get(spec, 0)
              if actual_for_spec != expected_for_spec:
                  errors_out.append(
                      "playwright_spec_testcase_count_mismatch="
                      f"{spec} expected={expected_for_spec} actual={actual_for_spec}"
                  )
              expected_titles = discovered_junit_titles.get(spec, [])
              actual_titles = junit_titles.get(spec, [])
              if Counter(actual_titles) != Counter(expected_titles):
                  errors_out.append(
                      "playwright_spec_title_mismatch="
                      f"{spec} expected={sorted(expected_titles)!r} actual={sorted(actual_titles)!r}"
                  )
          for spec in sorted(set(junit_counts) - set(expected_specs)):
              errors_out.append(f"unexpected_playwright_junit_spec={spec}")
          if failures:
              errors_out.append(f"playwright_failure_count={len(failures)}")
          if errors:
              errors_out.append(f"playwright_error_count={len(errors)}")
          if skipped:
              errors_out.append(f"playwright_skipped_count={len(skipped)}")
          if errors_out:
              raise SystemExit("\n".join(errors_out))
          with open(manifest_path, "a", encoding="utf-8") as fh:
              fh.write("playwright_junit_validation=passed\n")
          PY

          {
            echo "mode=$mode"
            echo "specs:"
            sed 's/^/- /' "$specs"
            echo "tests:"
            sed 's/^/- /' "$tests_list"
          } >> "$manifest"
          cat "$manifest"

      - name: Collect external stack logs (release candidate)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.gate == 'release_candidate'
        run: |
          docker compose ps > artifacts/e2e/external-stack-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps --tail=500 \
            postgres redis minio minio-init api worker \
            > artifacts/e2e/external-stack-docker.log 2>&1 || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            artifacts/e2e/
            test-results/
          if-no-files-found: error

  release-gate:
    name: Release Candidate Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'release_candidate'
    needs:
      - lint-and-type-check
      - backend-test
      - frontend-api-contract
      - backend-integration-test
      - frontend-build
      - e2e-test
    steps:
      - name: Download release candidate evidence artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/release-gate

      - name: Validate release candidate evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          backend_test_manifest=artifacts/release-gate/backend-test-artifacts/evidence-manifest.txt
          frontend_contract=artifacts/release-gate/frontend-api-contract-artifacts/openapi.json
          backend_manifest=artifacts/release-gate/backend-integration-artifacts/evidence-manifest.txt
          backend_openapi_contract=artifacts/release-gate/backend-integration-artifacts/openapi-contract-openapi.json
          backend_api_quality_summary=artifacts/release-gate/backend-integration-artifacts/api-test-quality/summary.json
          backend_api_quality_dashboard=artifacts/release-gate/backend-integration-artifacts/api-test-quality/index.md
          e2e_manifest=artifacts/release-gate/e2e-artifacts/evidence-manifest.txt
          if [ ! -s "$e2e_manifest" ]; then
            e2e_manifest=artifacts/release-gate/e2e-artifacts/artifacts/e2e/evidence-manifest.txt
          fi

          require_nonempty() {
            if [ ! -s "$1" ]; then
              echo "release_gate_missing_or_empty=$1"
              exit 1
            fi
          }

          require_line() {
            local path="$1"
            local pattern="$2"
            if ! grep -Fq "$pattern" "$path"; then
              echo "release_gate_missing_marker path=$path pattern=$pattern"
              exit 1
            fi
          }

          require_nonempty "$backend_test_manifest"
          require_nonempty "$frontend_contract"
          require_nonempty "$backend_manifest"
          require_nonempty "$backend_openapi_contract"
          require_nonempty "$backend_api_quality_summary"
          require_nonempty "$backend_api_quality_dashboard"
          require_nonempty "$e2e_manifest"

          require_line "$backend_test_manifest" "backend_test_artifacts_validation=passed"
          require_line "$backend_manifest" "collect_validation=passed"
          require_line "$backend_manifest" "junit_validation=strict_skips=True"
          require_line "$backend_manifest" "integration_skip_inventory=written skipped=0"
          require_line "$backend_manifest" "nodeid_validation=passed"
          require_line "$backend_manifest" "performance_summary_gate_profile=release_candidate"
          require_line "$backend_manifest" "performance_trend_validation=passed"
          require_line "$backend_manifest" "release_candidate_oom_tests=passed"
          require_line "$e2e_manifest" "mode=release_candidate"
          require_line "$e2e_manifest" "failure_count=0"
          require_line "$e2e_manifest" "error_count=0"
          require_line "$e2e_manifest" "skipped_count=0"
          require_line "$e2e_manifest" "actual_unexpected_count=0"
          require_line "$e2e_manifest" "actual_flaky_count=0"
          require_line "$e2e_manifest" "actual_skipped_count=0"
          require_line "$e2e_manifest" "playwright_actual_run_validation=passed"
          require_line "$e2e_manifest" "playwright_junit_validation=passed"

          python3 - "$frontend_contract" <<'PY'
          import json
          import sys
          from pathlib import Path

          openapi = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if openapi.get("info", {}).get("title") != "QA Platform API":
              raise SystemExit("release_gate_invalid_openapi_title")
          if "RunTrigger" not in openapi.get("components", {}).get("schemas", {}):
              raise SystemExit("release_gate_missing_run_trigger_schema")
          print("release_gate_frontend_api_contract=passed")
          PY

          mkdir -p artifacts/release-gate-summary
          {
            echo "# Release Candidate Evidence"
            echo
            echo "- backend unit artifacts: passed"
            echo "- frontend API contract: passed"
            echo "- OpenAPI contract smoke: passed"
            echo "- API test quality dashboard: passed"
            echo "- backend integration artifacts: passed"
            echo "- performance SLO gate profile: release_candidate"
            echo "- performance trend gate: passed"
            echo "- E2E mode: release_candidate"
            echo
            grep -F "performance_summary_gate_profile=" "$backend_manifest"
            grep -F "performance_trend_validation=" "$backend_manifest"
            grep -F "release_candidate_oom_tests=" "$backend_manifest"
            grep -F "mode=" "$e2e_manifest"
            grep -F "testcase_count=" "$e2e_manifest"
            grep -F "actual_testcase_count=" "$e2e_manifest"
          } > artifacts/release-gate-summary/release-evidence.md

      - name: Confirm release candidate evidence passed
        run: |
          cat <<'EOF'
          release_candidate_gate=passed
          required_jobs=lint-and-type-check,backend-test,frontend-api-contract,backend-integration-test,frontend-build,e2e-test
          evidence=frontend-api-contract,openapi-contract,api-test-quality,required-integration,heavy-docker,external-stack,performance-slo,full-playwright
          EOF

      - name: Upload release gate evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence
          path: artifacts/release-gate-summary/
          if-no-files-found: error
