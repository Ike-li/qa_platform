services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${QAP_DB_USER:-qaplatform}
      POSTGRES_PASSWORD: ${QAP_DB_PASSWORD:-qaplatform}
      POSTGRES_DB: ${QAP_DB_NAME:-qaplatform}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QAP_DB_USER:-qaplatform}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    # 镜像默认以 65532 运行；旧 MinIO 镜像以 root 写入的数据卷需要 root 才能继续读写
    user: "0:0"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MC_HOST_local: http://localhost:9000
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    # minio-client 镜像不带 shell，复用 minio 镜像里的 mc 和 sh
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      QAP_S3_BUCKET: ${QAP_S3_BUCKET:-qa-platform}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${QAP_S3_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      QAP_DATABASE_URL: postgresql+asyncpg://${QAP_DB_USER:-qaplatform}:${QAP_DB_PASSWORD:-qaplatform}@postgres:5432/${QAP_DB_NAME:-qaplatform}
      QAP_REDIS_URL: redis://redis:6379/0
      QAP_S3_ENDPOINT: http://minio:9000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["arq", "qaplatform.worker.settings.WorkerSettings"]
    env_file: .env
    environment:
      QAP_WORKER_QUEUE: queue:medium
      QAP_DATABASE_URL: postgresql+asyncpg://${QAP_DB_USER:-qaplatform}:${QAP_DB_PASSWORD:-qaplatform}@postgres:5432/${QAP_DB_NAME:-qaplatform}
      QAP_REDIS_URL: redis://redis:6379/0
      QAP_S3_ENDPOINT: http://minio:9000
      QAP_RUN_WORKSPACE_DIR: ${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}:${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}
    group_add:
      - "${QAP_DOCKER_SOCK_GROUP_ID:-0}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker-high:
    build: .
    restart: unless-stopped
    command: ["arq", "qaplatform.worker.settings.WorkerSettings"]
    env_file: .env
    environment:
      QAP_WORKER_QUEUE: queue:high
      QAP_DATABASE_URL: postgresql+asyncpg://${QAP_DB_USER:-qaplatform}:${QAP_DB_PASSWORD:-qaplatform}@postgres:5432/${QAP_DB_NAME:-qaplatform}
      QAP_REDIS_URL: redis://redis:6379/0
      QAP_S3_ENDPOINT: http://minio:9000
      QAP_RUN_WORKSPACE_DIR: ${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}:${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}
    group_add:
      - "${QAP_DOCKER_SOCK_GROUP_ID:-0}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker-low:
    build: .
    restart: unless-stopped
    command: ["arq", "qaplatform.worker.settings.WorkerSettings"]
    env_file: .env
    environment:
      QAP_WORKER_QUEUE: queue:low
      QAP_DATABASE_URL: postgresql+asyncpg://${QAP_DB_USER:-qaplatform}:${QAP_DB_PASSWORD:-qaplatform}@postgres:5432/${QAP_DB_NAME:-qaplatform}
      QAP_REDIS_URL: redis://redis:6379/0
      QAP_S3_ENDPOINT: http://minio:9000
      QAP_RUN_WORKSPACE_DIR: ${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}:${QAP_RUN_WORKSPACE_DIR:-/tmp/qap-workspaces}
    group_add:
      - "${QAP_DOCKER_SOCK_GROUP_ID:-0}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  miniodata:
