[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qaplatform"
version = "0.1.0"
description = "QA automation execution platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "arq>=0.26",
    "redis>=5.0",
    "aiobotocore>=2.0",
    "aiodocker>=0.22",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "structlog>=24.0",
    "prometheus-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-exporter-otlp-proto-http",
    "argon2-cffi>=23.0",
    "PyJWT>=2.8",
    "alembic>=1.13",
    "cryptography>=42.0",
    "tenacity",
    "sse-starlette",
    "httpx",
    "croniter>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "testcontainers",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "testcontainers",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qaplatform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "heavy_docker: integration tests that require Docker image pulls or real containers; run in nightly/manual lanes when registry stability matters",
    "external_stack: integration tests that require a separately running API/worker stack instead of the in-process ASGI test app",
    "openapi_contract: OpenAPI-driven API contract smoke tests for nightly/manual lanes",
    "performance: nonfunctional smoke tests for nightly/manual trend monitoring",
]
filterwarnings = [
    "ignore:The @wait_container_is_ready decorator is deprecated.*:DeprecationWarning:testcontainers.redis",
]

[tool.coverage.run]
source = ["qaplatform"]
branch = true

[tool.coverage.report]
fail_under = 83
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
# 显式固定 target-version，避免不同 Python 环境下推断出不同结果。
target-version = "py312"

[tool.ruff.lint]
# 必须显式声明规则集：ruff 的默认集合会随版本变化（0.16 起把 isort 的 I
# 加进了默认），此前本仓库没有 [tool.ruff] 配置，导致本地 0.15 通过而 CI 的
# 0.16 报 115 处 I001，同一份代码在两处得到不同结论。
#
# E4/E7/E9 + F 是 ruff 历史默认值，I 是 0.16 起的新增默认，这里一并固定下来。
select = ["E4", "E7", "E9", "F", "I"]
